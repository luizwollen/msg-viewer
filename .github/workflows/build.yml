name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pelo site do GitHub

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Build do app macOS
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false # sem assinatura de código

      - name: Upload do .dmg como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MSG-Viewer-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30 # fica disponível por 30 dias para download
