<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;">
<title>MSG Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #007AFF;
  --blue-dark: #0062CC;
  --blue-alpha: rgba(0,122,255,0.12);
  --bg: #ececec;
  --sidebar-bg: rgba(235,235,235,0.7);
  --toolbar-bg: rgba(246,246,246,0.88);
  --surface: #ffffff;
  --surface-alt: #f5f5f5;
  --border: rgba(0,0,0,0.08);
  --border-md: rgba(0,0,0,0.13);
  --text-1: #1a1a1a;
  --text-2: #555;
  --text-3: #999;
  --sidebar-w: 200px;
  --list-w: 300px;
  --toolbar-h: 52px;
  --r: 10px;
  --r-sm: 6px;
  --r-lg: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.10);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.14);
}

html, body {
  height: 100%; overflow: hidden;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 13px; color: var(--text-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ═══════════════════════════════
   LAYOUT SHELL
═══════════════════════════════ */
.app { display: flex; flex-direction: column; height: 100vh; }

/* ── Toolbar ── */
.toolbar {
  height: var(--toolbar-h); min-height: var(--toolbar-h);
  display: flex; align-items: center; gap: 8px;
  padding: 0 12px 0 80px; /* 80px = space for traffic lights */
  background: var(--toolbar-bg);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  backdrop-filter: blur(24px) saturate(1.8);
  border-bottom: 1px solid var(--border-md);
  -webkit-app-region: drag;
  flex-shrink: 0;
  z-index: 50;
}
.toolbar > * { -webkit-app-region: no-drag; }

.tb-search-wrap { flex: 1; max-width: 340px; position: relative; }
.tb-search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.tb-search {
  width: 100%; height: 26px; padding: 0 10px 0 28px;
  background: rgba(0,0,0,0.07); border: 1px solid transparent;
  border-radius: 20px; font-size: 12px; font-family: inherit; color: var(--text-1);
  outline: none; transition: all 0.15s;
}
.tb-search:focus { background: white; border-color: var(--blue); box-shadow: 0 0 0 2.5px rgba(0,122,255,0.22); }
.tb-search::placeholder { color: var(--text-3); }

.tb-spacer { flex: 1; }

.tb-btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 10px; border-radius: var(--r-sm);
  border: 1px solid var(--border-md); background: rgba(255,255,255,0.75);
  font-size: 12px; font-family: inherit; font-weight: 500;
  color: var(--text-1); cursor: pointer; transition: background 0.12s;
  -webkit-app-region: no-drag;
}
.tb-btn:hover { background: rgba(255,255,255,0.98); }
.tb-btn:active { background: rgba(230,230,230,0.9); }
.tb-btn-icon { width: 26px; padding: 0; justify-content: center; }
.tb-btn-primary { background: var(--blue); border-color: transparent; color: white; font-weight: 600; }
.tb-btn-primary:hover { background: var(--blue-dark); }

/* ── Body ── */
.body { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--sidebar-bg);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  backdrop-filter: blur(24px) saturate(1.8);
  border-right: 1px solid var(--border-md);
  display: flex; flex-direction: column;
  padding: 12px 8px 12px;
  overflow: hidden;
}
.sidebar-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-3);
  padding: 6px 10px 4px; margin-top: 4px;
}
.sidebar-item {
  display: flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 10px; border-radius: var(--r);
  cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--text-1); transition: background 0.1s;
}
.sidebar-item:hover:not(.active) { background: rgba(0,0,0,0.05); }
.sidebar-item.active { background: var(--blue); color: white; }
.sidebar-item.active .si-icon { color: white !important; }
.si-icon { width: 16px; height: 16px; flex-shrink: 0; color: var(--text-2); }
.si-badge {
  margin-left: auto; font-size: 10px; font-weight: 600;
  background: rgba(0,0,0,0.12); color: var(--text-2);
  padding: 1px 6px; border-radius: 20px; min-width: 18px; text-align: center;
}
.sidebar-item.active .si-badge { background: rgba(255,255,255,0.25); color: white; }

.sidebar-spacer { flex: 1; }

.sidebar-status {
  padding: 8px 10px 0; font-size: 11px; color: var(--text-3);
  display: flex; flex-direction: column; gap: 4px;
}
.sidebar-status-row { display: flex; align-items: center; gap: 5px; }
.dot-green { width: 6px; height: 6px; border-radius: 50%; background: #28C840; flex-shrink: 0; }
.sidebar-status-links { display: flex; gap: 10px; font-size: 10px; }
.sidebar-status-links span { cursor: pointer; color: var(--text-3); }
.sidebar-status-links span:hover { color: var(--blue); }

/* ── Email List Panel ── */
.email-list-panel {
  width: var(--list-w); flex-shrink: 0;
  border-right: 1px solid var(--border-md);
  background: #f2f2f2;
  display: flex; flex-direction: column; overflow: hidden;
}
.list-header {
  padding: 9px 14px 8px; border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--text-3); font-weight: 500; flex-shrink: 0;
}
.email-items { overflow-y: auto; flex: 1; }

.email-item {
  padding: 11px 14px 10px; border-bottom: 1px solid rgba(0,0,0,0.06);
  cursor: pointer; transition: background 0.1s; position: relative;
  border-left: 3px solid transparent;
}
.email-item:hover:not(.selected) { background: rgba(0,0,0,0.03); }
.email-item.selected {
  background: var(--blue-alpha);
  border-left-color: var(--blue);
  padding-left: 11px;
}
.ei-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 2px; }
.ei-from { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ei-time { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
.ei-subject { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
.ei-preview { font-size: 11px; color: var(--text-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ei-badges { display: flex; gap: 4px; margin-top: 5px; }
.ei-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 500; color: var(--text-2);
  padding: 1px 6px; background: rgba(0,0,0,0.07); border-radius: 4px;
}

/* ── Main Stage ── */
.main-stage { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }

/* ── Drop Zone ── */
.drop-zone {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: #f0f0f0; flex-direction: column; gap: 0;
}
.drop-card {
  background: white; border: 1px solid var(--border-md);
  border-radius: var(--r-lg); padding: 48px 56px 44px;
  text-align: center; max-width: 480px; width: 88%;
  box-shadow: var(--shadow);
  transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
}
.drop-card.drag-over {
  border-color: var(--blue);
  box-shadow: 0 0 0 4px rgba(0,122,255,0.15), var(--shadow);
  transform: scale(1.01);
}
.drop-icon {
  width: 76px; height: 76px; margin: 0 auto 22px;
  background: linear-gradient(145deg, #e8f0ff, #d4e5ff);
  border-radius: 18px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,122,255,0.15);
}
.drop-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
.drop-sub { font-size: 12px; color: var(--text-2); margin-bottom: 22px; }
.drop-btns { display: flex; gap: 9px; justify-content: center; margin-bottom: 22px; }
.drop-btn {
  height: 30px; padding: 0 18px; border-radius: 20px;
  font-size: 13px; font-family: inherit; font-weight: 600;
  cursor: pointer; border: none; transition: all 0.14s;
}
.drop-btn-p { background: var(--blue); color: white; }
.drop-btn-p:hover { background: var(--blue-dark); }
.drop-btn-s { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
.drop-btn-s:hover { background: var(--blue-alpha); }
.drop-hint { display: flex; align-items: center; gap: 5px; justify-content: center; color: var(--text-3); font-size: 11px; }

/* ── Email View ── */
.email-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.ev-header { padding: 18px 24px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ev-subject { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 14px; line-height: 1.25; }
.ev-meta { display: flex; align-items: flex-start; gap: 11px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: white; letter-spacing: -0.02em;
}
.ev-meta-info { flex: 1; min-width: 0; }
.ev-from { font-size: 13px; font-weight: 600; }
.ev-from-email { color: var(--text-2); font-weight: 400; }
.ev-to { font-size: 11px; color: var(--text-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-time-col { text-align: right; flex-shrink: 0; }
.ev-time { font-size: 11px; color: var(--text-2); }
.ev-finder-btn { font-size: 11px; color: var(--blue); cursor: pointer; margin-top: 2px; display: block; }
.ev-finder-btn:hover { text-decoration: underline; }

/* Attachments */
.ev-attachments { padding: 10px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ev-att-label { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.att-list { display: flex; flex-direction: column; gap: 5px; }
.att-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 11px; border: 1px solid var(--border-md);
  border-radius: var(--r); background: var(--surface-alt);
  transition: background 0.1s;
}
.att-row:hover { background: #ebebeb; }
.att-file-icon {
  width: 30px; height: 30px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.att-name { font-size: 12px; font-weight: 500; }
.att-size { font-size: 10px; color: var(--text-3); }
.att-spacer { flex: 1; }
.att-dl-btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 24px; padding: 0 9px; border-radius: var(--r-sm);
  border: 1px solid var(--border-md); background: white;
  font-size: 11px; font-family: inherit; font-weight: 500;
  color: var(--blue); cursor: pointer; transition: background 0.12s;
}
.att-dl-btn:hover { background: var(--blue-alpha); }

/* Body */
.ev-body-wrap { flex: 1; overflow-y: auto; }
.ev-body-iframe { width: 100%; height: 100%; border: none; background: white; }
.ev-body-text { padding: 20px 24px 40px; font-size: 14px; line-height: 1.7; color: var(--text-1); white-space: pre-wrap; word-break: break-word; }

/* Status bar */
.statusbar {
  height: 24px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border-md);
  background: var(--sidebar-bg);
  -webkit-backdrop-filter: blur(24px);
  flex-shrink: 0; font-size: 10px; color: var(--text-3);
}
.sb-left { display: flex; align-items: center; gap: 8px; }
.sb-right { display: flex; gap: 12px; }
.sb-right span { cursor: pointer; }
.sb-right span:hover { color: var(--blue); }

/* Modal */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.28); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.18s;
  -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: white; border-radius: var(--r-lg);
  width: 460px; max-height: 55vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); border: 1px solid var(--border-md);
  transform: scale(0.94); transition: transform 0.18s; overflow: hidden;
}
.overlay.open .modal { transform: scale(1); }
.modal-head {
  padding: 13px 15px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.modal-title { font-size: 13px; font-weight: 600; }
.modal-close {
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.08); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s;
}
.modal-close:hover { background: rgba(0,0,0,0.16); }
.modal-body { overflow-y: auto; flex: 1; }
.recent-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 15px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.1s;
}
.recent-item:last-child { border-bottom: none; }
.recent-item:hover { background: var(--surface-alt); }
.ri-icon {
  width: 32px; height: 32px; border-radius: 7px;
  background: #EEF4FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.ri-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ri-sub { font-size: 10px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ri-spacer { flex: 1; min-width: 0; }
.ri-open { font-size: 11px; color: var(--blue); font-weight: 500; flex-shrink: 0; }
.modal-empty { padding: 32px 20px; text-align: center; color: var(--text-3); font-size: 12px; }

/* Toast */
.toast {
  position: fixed; bottom: 36px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: rgba(28,28,30,0.90); color: white;
  padding: 7px 16px; border-radius: 20px;
  font-size: 12px; font-weight: 500;
  opacity: 0; transition: all 0.22s; pointer-events: none; z-index: 999;
  -webkit-backdrop-filter: blur(10px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Loading */
.loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 10px; color: var(--text-2); font-size: 12px;
}
.spinner {
  width: 22px; height: 22px; border: 2px solid rgba(0,122,255,0.2);
  border-top-color: var(--blue); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Error state */
.error-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 8px; padding: 40px; text-align: center;
}
.error-state .err-icon { font-size: 32px; margin-bottom: 4px; }
.error-state .err-title { font-size: 14px; font-weight: 600; }
.error-state .err-msg { font-size: 12px; color: var(--text-2); }

/* Scrollbars */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.14); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.24); }

/* Avatar colors */
.av-blue   { background: linear-gradient(135deg,#007AFF,#0055D4); }
.av-green  { background: linear-gradient(135deg,#34C759,#1A8A37); }
.av-orange { background: linear-gradient(135deg,#FF9500,#CC6F00); }
.av-purple { background: linear-gradient(135deg,#AF52DE,#7A2BAA); }
.av-red    { background: linear-gradient(135deg,#FF3B30,#C41E14); }
.av-teal   { background: linear-gradient(135deg,#5AC8FA,#007AFF); }
.av-pink   { background: linear-gradient(135deg,#FF2D55,#CC0033); }
.av-indigo { background: linear-gradient(135deg,#5856D6,#3634A3); }

#file-input { display: none; }
</style>
</head>
<body>

<div class="app">

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="tb-search-wrap">
      <svg class="tb-search-icon" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="tb-search" id="tb-search" type="text" placeholder="Pesquisar mensagens..." oninput="onSearch(this.value)">
    </div>
    <div class="tb-spacer"></div>
    <button class="tb-btn tb-btn-icon" title="Abrir no Finder" onclick="doShowInFinder()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
    <button class="tb-btn tb-btn-icon" title="Importar .MSG" onclick="triggerOpen()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <button class="tb-btn tb-btn-icon" title="Imprimir" onclick="doPrint()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    </button>
    <button class="tb-btn" onclick="triggerOpen()">Abrir…</button>
    <button class="tb-btn tb-btn-primary" onclick="doDownloadAll()">Download All</button>
  </div>

  <div class="body">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section-label">Mailbox</div>
      <div class="sidebar-item active" id="si-all" onclick="setCategory('all',this)">
        <svg class="si-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,7 12,13 22,7"/></svg>
        Todas as Mensagens
        <span class="si-badge" id="badge-all">0</span>
      </div>
      <div class="sidebar-item" id="si-att" onclick="setCategory('attachments',this)">
        <svg class="si-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        Com Anexos
        <span class="si-badge" id="badge-att">0</span>
      </div>
      <div class="sidebar-item" id="si-fav" onclick="setCategory('favorites',this)">
        <svg class="si-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Favoritos
      </div>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-status">
        <div class="sidebar-status-row">
          <div class="dot-green"></div>
          <span>Sistema Pronto · v1.0.0</span>
        </div>
        <div class="sidebar-status-links">
          <span onclick="openRecent()">Recentes</span>
        </div>
      </div>
    </div>

    <!-- Email List -->
    <div class="email-list-panel">
      <div class="list-header" id="list-header">Nenhuma mensagem</div>
      <div class="email-items" id="email-items">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:8px;color:var(--text-3);font-size:12px;">
          <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,7 12,13 22,7"/></svg>
          <span>Abra um arquivo .MSG</span>
        </div>
      </div>
    </div>

    <!-- Main Stage -->
    <div class="main-stage" id="main-stage">
      <div class="drop-zone" id="drop-zone">
        <div class="drop-card" id="drop-card">
          <div class="drop-icon">
            <svg width="34" height="34" fill="none" stroke="#007AFF" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="12" y2="12"/><line x1="15" y1="15" x2="12" y2="12"/></svg>
          </div>
          <div class="drop-title">Arraste seu arquivo .MSG aqui</div>
          <div class="drop-sub">Tamanho máximo: 45MB · Formato Outlook</div>
          <div class="drop-btns">
            <button class="drop-btn drop-btn-p" onclick="triggerOpen()">Selecionar Arquivo</button>
            <button class="drop-btn drop-btn-s" onclick="openRecent()">Abrir Recentes</button>
          </div>
          <div class="drop-hint">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
            Compatível com arquivos Outlook .MSG
          </div>
        </div>
      </div>

      <div class="email-view" id="email-view" style="display:none;"></div>
    </div>

  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <div class="sb-left">
      <div class="dot-green"></div>
      <span id="sb-text">Pronto</span>
    </div>
    <div class="sb-right">
      <span onclick="triggerOpen()">Abrir .MSG</span>
      <span onclick="openRecent()">Recentes</span>
    </div>
  </div>

</div>

<!-- Recent Modal -->
<div class="overlay" id="overlay" onclick="onOverlayClick(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Arquivos Recentes</div>
      <button class="modal-close" onclick="closeRecent()">
        <svg width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- File input -->
<input type="file" id="file-input" accept=".msg" onchange="onFileInput(event)">

<script src="app.js"></script>
</body>
</html>
